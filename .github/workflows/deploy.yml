name: Deploy to server

# DEPLOYS ONLY WHEN SOMEONE PRESSES THE BUTTON: a push deploys nothing, so testing and production change only when
# a person decides. The button is this workflow's "Run workflow", in three places (Inventory_Shipment's
# deploy/README.md, "Deploying with a button"):
#
#   GitHub          Actions > "Deploy to server" > Run workflow
#   VS Code         the GitHub Actions view (extension "GitHub Actions" by GitHub) > Workflows > Deploy to server > Run
#   Visual Studio   Tools > Deploy testing (an External Tools entry that calls the GitHub CLI)
#
# choosing the environment:
#
#   testing      https://test.<domain>, the main branch
#   production   https://<domain>, the production branch - "production" must also be typed in the confirm box, so
#                a click meant for testing never updates production
#
# The server runs that environment's deploy/update.sh: backup, pull of BOTH repositories (API and frontend),
# rebuild, restart. The same workflow is in both repositories: either one's button deploys both. One-time setup:
# deploy/enable-github-deploy.sh on the server, then the secrets it prints, in both repositories. The server also
# logs each deployment: /var/log/inventory-deploy-<environment>.log.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [testing, production]
        default: testing
      confirm:
        description: To deploy production, type production here (leave it empty for testing)
        type: string
        required: false
        default: ''

# One deployment per environment at a time from this repository (the server also queues them).
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Run update.sh on the server
        env:
          # Inputs reach the script as variables, never pasted into it: a typed value cannot become a command.
          TARGET: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          case "$TARGET" in
            testing) ;;
            production)
              typed=$(printf '%s' "$CONFIRM" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
              if [ "$typed" != "production" ]; then
                echo "::error::Not deployed: to deploy production, type production in the confirm box of Run workflow."
                exit 1
              fi ;;
            *)
              echo "::error::Not deployed: the environment must be testing or production."
              exit 1 ;;
          esac

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is missing. Run deploy/enable-github-deploy.sh on the server and save what it prints (Inventory_Shipment repository, deploy/README.md, \"Deploying with a button\")."
              exit 1
            fi
          done

          dir="$RUNNER_TEMP/deploy-ssh"
          install -d -m 700 "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$dir/key"
          chmod 600 "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$dir/known_hosts"

          echo "Deploying $TARGET"
          # The key can only run inventory-deploy on the server (a forced command): the one word sent is
          # the environment.
          ssh -T -i "$dir/key" -p "${DEPLOY_PORT:-22}" \
              -o IdentitiesOnly=yes -o UserKnownHostsFile="$dir/known_hosts" -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" "$TARGET"
