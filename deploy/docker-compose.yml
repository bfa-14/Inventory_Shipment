# Inventory & Shipment on one Linux server. See README.md in this folder.
#
# The same file runs both environments, each from its own checkout with its own deploy/.env:
#
#   production  /opt/inventory       production branch   project "inventory"
#   testing     /opt/inventory-test  main branch         project "inventory-test"
#
# Each environment has its own containers, database and volumes:
#
#   db     SQL Server (Express edition unless MSSQL_PID says otherwise). Never published at all. Testing may instead
#          keep its database in production's SQL Server and run none (docker-compose.shared-sql.yml, README.md
#          "One SQL Server for both environments").
#   api    Inventory_Shipment.API, on the server's 127.0.0.1:API_PORT only. Applies Schema.sql at start-up.
#   web    The React app (built from Inventory_Shipment_Frontend), plain HTTP on 127.0.0.1:TUNNEL_PORT only.
#
# and production also runs the one container the internet reaches:
#
#   proxy  Caddy on ports 80/443 (proxy/Caddyfile): HTTPS certificates for both addresses, DOMAIN to
#          production and TEST_DOMAIN to testing (/api and /health to the API, the rest to the web app).
#
# Settings come from deploy/.env (setup.sh writes it; .env.example lists every one).

name: ${COMPOSE_PROJECT_NAME:-inventory}

services:
  proxy:
    image: ${PROXY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    # On the host network: Caddy sees the real client address and reaches both environments on 127.0.0.1.
    network_mode: host
    # Production runs it (1); testing sets PROXY_REPLICAS=0, the ports belong to production's.
    deploy:
      replicas: ${PROXY_REPLICAS:-1}
    # After web: on a server set up before the proxy existed, web held ports 80/443 and must let them go first.
    depends_on:
      - web
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      TEST_DOMAIN: ${TEST_DOMAIN:?set TEST_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      PRODUCTION_WEB: 127.0.0.1:${TUNNEL_PORT:-8080}
      PRODUCTION_API: 127.0.0.1:${API_PORT:-5080}
      TESTING_WEB: 127.0.0.1:${TEST_TUNNEL_PORT:-8081}
      TESTING_API: 127.0.0.1:${TEST_API_PORT:-5081}
      # Who may open the testing address (proxy/Caddyfile): addresses or ranges separated by spaces.
      TEST_ALLOWED_IPS: ${TEST_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      # The folder, not the file: a git pull replaces the file, and a mount of the file would keep showing
      # the old one. update.sh then loads it with "caddy reload".
      - ./proxy:/etc/caddy:ro
      # The HTTPS certificates. Losing them only means Caddy asks Let's Encrypt again.
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2025-latest}
    restart: unless-stopped
    # Testing sets 500: when memory runs out, the kernel stops testing's processes before production's.
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in deploy/.env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    volumes:
      - sqldata:/var/opt/mssql
      # backup.sh writes here and restore.sh reads from here: the deploy/backups folder on the server.
      - ./backups:/var/opt/mssql/backups
    healthcheck:
      # The password goes through SQLCMDPASSWORD so it never appears on a command line.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: ..
    # Per environment, so building testing never replaces the image production runs.
    image: ${COMPOSE_PROJECT_NAME:-inventory}-api
    restart: unless-stopped
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # For the proxy (and an SSH tunnel): the server's loopback only, never the internet.
      - "127.0.0.1:${API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # The proxy is in front: take the client's address and https from its X-Forwarded-* headers, so the
      # login rate limit and the login audit see the real client instead of the proxy. Safe because the
      # API listens on 127.0.0.1 only and the proxy overwrites those headers on the way in.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Its own SQL Server as sa unless deploy/.env says otherwise: testing on production's SQL Server connects to
      # DB_SERVER=inventory-db as its own login (DB_USER / DB_PASSWORD), which owns its database and nothing else.
      ConnectionStrings__DefaultConnection: "Server=${DB_SERVER:-db};Database=${DB_NAME:-Inventory_Shipment};User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-${MSSQL_SA_PASSWORD}};Encrypt=True;TrustServerCertificate=True"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in deploy/.env}
      # Used only while the Users table is empty, to create the first administrator.
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      # The address put in emailed links; Settings > Email can override it.
      App__PublicBaseUrl: https://${DOMAIN}
      # "testing" holds every email (or sends them all to TEST_EMAIL_REDIRECT_TO): its data is a copy of
      # production's, with real people's addresses in it. Required, never defaulted: a testing .env that
      # lost the line must stop here rather than run as production.
      App__Environment: ${ENVIRONMENT:?set ENVIRONMENT (production or testing) in deploy/.env}
      App__TestEmailRedirectTo: ${TEST_EMAIL_REDIRECT_TO:-}
    volumes:
      - dpkeys:/app/App_Data
    healthcheck:
      # The image has no curl: a plain HTTP request to /health over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The first start creates the database and applies the whole schema.
      start_period: 5m

  web:
    build:
      context: ${WEB_SOURCE_DIR:-../../Inventory_Shipment_Frontend}
    image: ${COMPOSE_PROJECT_NAME:-inventory}-web
    restart: unless-stopped
    oom_score_adj: ${OOM_SCORE_ADJ:-0}
    depends_on:
      - api
    ports:
      # For the proxy and an SSH tunnel: the server's loopback only, never the internet.
      - "127.0.0.1:${TUNNEL_PORT:-8080}:8080"
    environment:
      API_UPSTREAM: api:8080
      # Served as /environment.json: the sign-in page's Production / Testing switch and the TESTING marker.
      APP_ENVIRONMENT: ${ENVIRONMENT:?set ENVIRONMENT (production or testing) in deploy/.env}
      APP_SWITCH_URL: ${SWITCH_URL:-}

volumes:
  sqldata:
  dpkeys:
  caddy_data:
  caddy_config:
